<text x="296" y="592" font-size="16" font-weight="400" fill="#666666" text-anchor="middle">no</text>
<rect x="60" y="612" width="420" height="62" rx="12" fill="#f6f8fa" stroke="#257de0" stroke-width="2.5"/>
<text x="270.0" y="650" font-size="19" font-weight="600" fill="#191919" text-anchor="middle">CRUISE at the set speed (max 30 km/h)</text>
<text x="24" y="712" font-size="17" font-weight="400" fill="#666666" text-anchor="start">Planned logic for Stage 3. The time-to-collision limit will be tuned in the simulator.</text>
<text x="24" y="738" font-size="17" font-weight="400" fill="#666666" text-anchor="start">Already built on the laptop side: no command for 0.5 s gives full brake, even if the board dies.</text>
