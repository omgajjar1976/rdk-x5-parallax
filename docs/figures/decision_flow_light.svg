<text x="548" y="394" font-size="16" font-weight="400" fill="#666666" text-anchor="middle">yes</text>
<rect x="600" y="373" width="360" height="62" rx="12" fill="#f6f8fa" stroke="#f47230" stroke-width="2.5"/>
