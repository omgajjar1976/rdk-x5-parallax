<path d="M270,480 L500,526 L270,572 L40,526 z" fill="#f6f8fa" stroke="#257de0" stroke-width="2.5"/>
<text x="270" y="533" font-size="18" font-weight="600" fill="#191919" text-anchor="middle">Object ahead in my lane?</text>
<path d="M500,526 L598,526" stroke="#8c959f" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<text x="548" y="516" font-size="16" font-weight="400" fill="#666666" text-anchor="middle">yes</text>
<rect x="600" y="495" width="360" height="62" rx="12" fill="#f6f8fa" stroke="#257de0" stroke-width="2.5"/>
